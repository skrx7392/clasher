name: Manifests

# Pre-merge lint for the Kubernetes manifests (#13). CD (cd.yml) only runs post-merge, so this
# renders every Clasher kustomization and schema-validates it here — a broken manifest fails the
# PR instead of the deploy. No cluster, no secrets: pure render + kubeconform.
on:
  pull_request:
    paths:
      - "deploy/k8s/**"
      - ".github/workflows/manifests.yml"
  push:
    branches: [main]
    paths:
      - "deploy/k8s/**"

permissions:
  contents: read

concurrency:
  group: manifests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Install kubeconform (pinned + checksum-verified)
        run: |
          set -euo pipefail
          version=v0.8.0
          sha256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${version}/kubeconform-linux-amd64.tar.gz"
          echo "${sha256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz kubeconform

      - name: Render + schema-validate every Clasher kustomization
        run: |
          set -euo pipefail
          # The bootstrap overlay carries Traefik/cert-manager CRDs kubeconform has no schema
          # for — -ignore-missing-schemas skips those and still validates every core object.
          # workloads/ and migrate/ are core-only, so -strict fully validates them.
          for dir in \
            deploy/k8s/overlays/quasar \
            deploy/k8s/workloads \
            deploy/k8s/migrate; do
            echo "== ${dir} =="
            kubectl kustomize "${dir}" \
              | kubeconform -strict -summary -ignore-missing-schemas -
          done
