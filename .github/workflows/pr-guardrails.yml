name: PR Guardrails

# `pull_request` (not pull_request_target): these guardrails need no write token
# or secrets, so we avoid the untrusted-code/secret exposure of
# pull_request_target. No untrusted input is interpolated into any run: step; the
# actions read the event payload internally.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# Minimal permissions (DESIGN §9).
permissions:
  contents: read

concurrency:
  group: pr-guardrails-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional-commit-title:
    name: conventional-commit-title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never
