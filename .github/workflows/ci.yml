name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimal permissions (DESIGN §9).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only cancel superseded PR runs — never cancel a main run (keeps its `ci` status).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Job id/name is exactly `ci` so the branch ruleset can require the `ci` check.
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Installs pnpm from package.json#packageManager (pinned 11.x).
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap/fast checks first for faster failure feedback (single `ci` check).
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
