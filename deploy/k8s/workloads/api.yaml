# @clasher/api — NestJS backend (DESIGN §8/§9). Per-release workload rolled by CD (#13),
# NOT part of the admin-applied bootstrap base (see README → Bootstrap vs deploy). The
# image tag is stamped to the built commit SHA at deploy time (`kustomize`/`kubectl -k`).
#
# Pod labels are load-bearing for NetworkPolicy: name=api is admitted by Traefik and by web
# (the #8/#6 ingress allows) and component=backend is granted egress to Postgres/Redis. Both
# must be present or the default-deny drops the pod's traffic.
#
# Probes are `exec` (a tiny in-container Node HTTP client against 127.0.0.1), not httpGet, so
# they run over loopback and are never subject to the namespace default-deny — matching the
# data tier's exec-probe pattern. Readiness hits /api/ready (which SELECT 1s Postgres), so the
# rollout only completes once the DB is reachable; liveness/startup hit /api/health (no deps).
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: clasher-backend
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: clasher-backend
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: clasher
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: clasher-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Tag is overridden per-deploy by CD (kustomize set image) to the commit SHA.
          image: ghcr.io/skrx7392/clasher-api:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
          # DATABASE_URL + REDIS_QUEUE_URL + REDIS_CACHE_URL (keys match the env contract).
          # The api validates all three at boot (fail-loud); it opens Postgres on the request
          # path and does not connect to Redis in M0. Secret is admin-provisioned out-of-band.
          envFrom:
            - secretRef:
                name: api-credentials
          volumeMounts:
            # readOnlyRootFilesystem is on; give the process a small writable /tmp.
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 750m
              memory: 512Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - node
                - -e
                - require("http").get("http://127.0.0.1:3000/api/health",(r)=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - require("http").get("http://127.0.0.1:3000/api/ready",(r)=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - require("http").get("http://127.0.0.1:3000/api/health",(r)=>process.exit(r.statusCode===200?0:1)).on("error",()=>process.exit(1))
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
