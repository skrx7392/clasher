# Clasher k8s base (DESIGN §9/§10). The substrate every other infra manifest extends:
# scoped namespaces, default-deny NetworkPolicies + explicit allows, scoped RBAC, and
# the resource requests/limits convention. No label transformer is used on purpose —
# labels are hand-written on each object so NetworkPolicy/RBAC selectors are never
# mutated implicitly (important for a security base).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - networkpolicies/frontend.yaml
  - networkpolicies/frontend-google-egress.yaml
  - networkpolicies/backend.yaml
  - networkpolicies/database.yaml
  - networkpolicies/traefik.yaml
  - networkpolicies/ddns.yaml
  - networkpolicies/backup.yaml
  - rbac/serviceaccounts.yaml
  - rbac/deployer-rbac.yaml
  - resource-management/limitranges.yaml
  - resource-management/resourcequotas.yaml
  - data/postgres.yaml
  - data/redis-queue.yaml
  - data/redis-cache.yaml
  - ingress/issuer.yaml
  - ingress/certificate.yaml
  - ingress/routes.yaml
  - dns/ddns-cronjob.yaml
  - backup/pg-backup-cronjob.yaml

# The in-cluster backup script is generated from its source file so there is one source of truth
# (the same file is exercised by deploy/backup/restore-drill.sh integration tests). The CronJob's
# `pg-backup-script` ConfigMap reference is rewritten to the hashed name automatically.
configMapGenerator:
  - name: pg-backup-script
    namespace: clasher-backend
    files:
      - backup/backup.sh
