# Per-workload ServiceAccounts (DESIGN §9: RBAC/ServiceAccounts scoped to clasher-*).
# None of these workloads call the Kubernetes API, so each disables token automount —
# no API credential is ever mounted into an app pod (least privilege). Workload
# manifests in later issues reference these by name instead of the namespace `default`
# SA. No Role/RoleBinding is attached: these identities have zero API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clasher-web
  namespace: clasher-frontend
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clasher-api
  namespace: clasher-backend
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: api
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clasher-coc-gateway
  namespace: clasher-backend
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: coc-gateway
automountServiceAccountToken: false
---
# Identity for the CD migration-gate Job (#13). It runs `node-pg-migrate up` and talks only to
# Postgres — it never calls the Kubernetes API — so, like the app SAs, it mounts no API token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clasher-migrate
  namespace: clasher-backend
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: migrate
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clasher-postgres
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: postgres
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clasher-redis
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: redis
automountServiceAccountToken: false
