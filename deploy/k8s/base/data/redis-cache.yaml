# Redis (cache role) — EPHEMERAL (DESIGN §2). Bounded maxmemory + allkeys-lru eviction,
# NO persistence and NO PVC: it is a pure cache whose eviction must never touch the durable
# queue (which is a separate workload). A Deployment (not StatefulSet) since it is stateless;
# scratch goes to an emptyDir bounded by the pod's ephemeral-storage limit. Reachable only
# from backend (#6 allow-ingress-redis-from-backend). AUTH from Secret `redis-credentials`.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cache-config
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/component: cache
data:
  redis.conf: |
    # Bounded LRU cache: evict least-recently-used keys when full; no persistence.
    maxmemory 512mb
    maxmemory-policy allkeys-lru
    appendonly no
    save ""
    dir /data
---
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: redis-cache
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: redis-cache
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: clasher
        app.kubernetes.io/name: redis-cache
        app.kubernetes.io/component: cache
    spec:
      serviceAccountName: clasher-redis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - /etc/redis/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
          volumeMounts:
            - name: config
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping | grep -q PONG
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: redis-cache-config
        - name: data
          emptyDir:
            sizeLimit: 256Mi
