# Postgres — system of record (DESIGN §1/§3/§9, NFR-7). StatefulSet with a durable
# local-path PVC so data survives pod restarts/reschedules. Reachable only from backend
# (the #6 default-deny + allow-ingress-postgres-from-backend policy selects name=postgres).
#
# Credentials come from the out-of-band Secret `postgres-credentials` (bootstrap runbook
# #11), keys: username, password, dbname. No credentials are baked into this manifest.
#
# securityContext is PSA-restricted-clean (the clasher-database namespace enforces baseline
# and warns/audits at restricted): runs as uid/gid 70 — the alpine image's built-in non-root
# postgres user (the Debian variant uses 999) — drops all capabilities, no privilege
# escalation, RuntimeDefault seccomp. PGDATA is a subdirectory of the mount so the volume root
# (perms/lost+found) is never used as the data directory, and fsGroup 70 makes the PVC
# group-writable by the postgres process.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  # Headless service: stable DNS (postgres.clasher-database.svc) resolving to the pod.
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      protocol: TCP
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: clasher-database
  labels:
    app.kubernetes.io/part-of: clasher
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: clasher
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: clasher-postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dbname
            # Data dir is a subdirectory of the mounted volume.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # Startup can include first-boot initdb; allow generous time before liveness.
          startupProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/part-of: clasher
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
