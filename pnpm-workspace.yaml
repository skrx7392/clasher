packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency build (postinstall) scripts by default for
# supply-chain safety. esbuild (pulled in by vitest) runs an install script;
# allow only that one explicitly so `pnpm install` exits 0 on a fresh host (NFR-2).
allowBuilds:
  esbuild: true
